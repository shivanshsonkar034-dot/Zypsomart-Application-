<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zypsomart</title>

<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="/manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#16a34a;
  --dark:#000000;
  --light:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#f8fafc;
}

/* ================= HEADER ================= */

.app-header{
  background:linear-gradient(135deg,#000000,#0f172a);
  padding:18px 0;
  position:sticky;
  top:0;
  z-index:999;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.logo-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* LOGO TEXT ANIMATION */

.brand-wrapper{
  display:flex;
  flex-direction:column;
  animation:fadeSlide 1s ease forwards;
}

.brand-name{
  font-size:28px;
  font-weight:900;
  background:linear-gradient(90deg,#22c55e,#16a34a,#000000);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:1px;
}

.tagline{
  font-size:12px;
  color:#22c55e;
  font-weight:600;
  margin-top:2px;
  animation:blink 2s infinite;
}

/* Glow effect */
.brand-name::after{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  filter:blur(15px);
  opacity:.3;
}

/* SEARCH */
#product-search{
  width:100%;
  margin-top:15px;
  padding:12px 20px;
  border-radius:50px;
  border:none;
  outline:none;
  font-size:14px;
}

/* CART BUTTON */
.icon-btn{
  cursor:pointer;
  font-size:20px;
  color:white;
  position:relative;
}

#cart-count{
  position:absolute;
  top:-8px;
  right:-10px;
  background:var(--primary);
  color:white;
  font-size:12px;
  padding:3px 6px;
  border-radius:50%;
}

/* Animations */
@keyframes fadeSlide{
  from{
    opacity:0;
    transform:translateY(-20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.4}
}

.container{
  width:95%;
  max-width:1200px;
  margin:auto;
}
</style>
</head>

<body>

<header class="app-header">
<div class="container">

<div class="logo-row">

<div class="brand-wrapper">
  <div class="brand-name">𝐙𝐢𝐩𝐬𝐨</div>
  <div class="tagline">Delivery in minutes...</div>
</div>

<div style="display:flex; gap:15px; align-items:center;">
  <div id="auth-btn" class="icon-btn">👤</div>
  <div id="cart-btn" class="icon-btn">
    🛒<span id="cart-count">0</span>
  </div>
</div>

</div>

<input type="text" id="product-search" placeholder="Search products...">

</div>
</header>

<main class="container" style="padding:40px 0;">
<h2>Welcome to zipso 🚀</h2>
</main>

<script type="module" src="app.js"></script>

</body>
</html>
